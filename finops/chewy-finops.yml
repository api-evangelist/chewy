specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Chewy
providerId: chewy
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Dsco
  - E-Commerce
  - EDI
  - Pet Retail
  - Vendor Integration
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for Chewy vendor integration: Chewy itself does not bill suppliers
  per API call. Cost shape is the Dsco / CommerceHub platform subscription plus normal trading-partner
  economics (drop-ship fees, returns, chargebacks) — not metered API usage.'
notes: Chewy does not publish a usage-based billing surface for its APIs. The FinOps shape below
  reflects the Dsco supplier subscription cost.
sources:
  - https://www.chewy.com/
  - https://www.dsco.io/
  - https://www.commercehub.com/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Chewy, Inc.
serviceCategory: E-Commerce / Vendor Integration
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Adjustment
focusColumns:
  ServiceName: Chewy Vendor Integration (Dsco)
  ServiceCategory: E-Commerce / EDI
  ProviderName: Chewy
  PublisherName: Chewy, Inc.
  InvoiceIssuerName: CommerceHub (Dsco platform)
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Subscription
meters:
  - name: dsco_subscription
    description: Monthly Dsco supplier-platform subscription line
    unit: month
    aggregation: sum
    dimensions:
      - tier
      - supplier_id
  - name: edi_transactions
    description: Volume of EDI documents (850, 846, 856, 810) exchanged through the Dsco connector
    unit: transaction
    aggregation: sum
    dimensions:
      - document_type
      - retailer
  - name: chargebacks
    description: Trading-partner chargebacks issued by Chewy for compliance violations
    unit: event
    aggregation: sum
    dimensions:
      - reason
      - po_number
principles:
  - name: Visibility
    description: Track Dsco subscription invoices, EDI transaction counts in the Dsco portal, and
      Chewy chargeback statements as the three cost surfaces for the integration.
  - name: Allocation
    description: Tag Dsco connector cost to the channel (Chewy) and to the brand / SKU family that
      drives the volume so e-commerce ops can see channel margin.
  - name: Optimization
    description: Reduce chargebacks by tightening ASN accuracy and inventory feed cadence; size the
      Dsco tier to actual document volume rather than negotiated peaks.
  - name: Accountability
    description: E-commerce / channel operations owns the Chewy P&L; supply chain owns ASN compliance;
      finance reconciles Dsco invoices and Chewy chargeback settlements.
maintainers:
