provider: Chewy
providerId: chewy
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Dsco
  - Drop Shipping
  - E-Commerce
  - EDI
  - Pet Retail
  - Vendor Integration
description: Chewy does not operate a public, consumer-facing developer API or a published commercial
  pricing page for API access. Vendor and supplier integration is provided exclusively through the
  Dsco supplier-integration platform (a CommerceHub product). Onboarding, pricing, and access are
  negotiated as part of the Chewy vendor onboarding process — there are no listed tiers, monthly
  request quotas, or per-call prices.
notes: No public pricing page exists. Pricing for the Dsco integration that brands use to connect to
  Chewy is negotiated directly with Chewy / CommerceHub during vendor onboarding.
sources:
  - https://www.chewy.com/
  - https://www.dsco.io/
  - https://www.commercehub.com/
plans:
  - id: chewy-vendor-integration
    name: Vendor Integration (Dsco)
    type: enterprise
    description: Access to Chewy's vendor integration is granted to approved suppliers through the
      Dsco platform. Pricing and feature scope are set as part of the vendor / supplier agreement
      with Chewy (via CommerceHub for the Dsco platform component).
    entries:
      - label: Vendor onboarding
        name: vendor_onboarding
        type: flat
        metric: varies
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: contact Chewy vendor relations
        userMultiplied: false
      - label: Dsco platform license
        name: dsco_license
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: see CommerceHub / Dsco contract
        userMultiplied: false
    elements:
      - name: EDI 850 Purchase Order
      - name: EDI 846 Inventory Update
      - name: EDI 856 Shipment Confirmation
      - name: EDI 810 Invoice
      - name: Dsco supplier portal access
      - name: Token-based REST authentication on api.dsco.io
