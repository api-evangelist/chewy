specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Chewy
providerId: chewy
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Dsco
  - E-Commerce
  - EDI
  - Vendor Integration
  - Rate Limiting
description: Chewy's vendor integration runs on the Dsco platform (api.dsco.io). Dsco does not publish
  consumer-facing per-second rate limits; throttling and backpressure policies are governed by Dsco /
  CommerceHub for the supplier tenant and are typically communicated through onboarding documentation
  rather than a public limits page.
notes: No public rate-limit numbers are published for api.dsco.io. Approved suppliers should consult
  the Dsco developer documentation provided through the supplier portal.
sources:
  - https://www.dsco.io/
  - https://api.dsco.io/
responseCodes:
  throttled: 429
  serverError: 500
  serviceUnavailable: 503
limits:
  - name: Dsco API requests
    scope: supplier-account
    metric: varies
    limit: 'see Dsco supplier portal documentation'
    notes: Dsco applies per-tenant throttling but does not publish numeric limits. Consult the supplier
      onboarding portal for current ceilings.
policies:
  - name: Backoff Strategy
    description: On 429 / 5xx responses, retry with exponential backoff and jitter. Honor Retry-After
      when present.
  - name: Bulk Operations
    description: For large catalog or inventory updates, prefer Dsco's bulk endpoints / batched feeds
      over per-record API calls to avoid throttling.
  - name: Pagination
    description: Iterate large result sets with the documented cursor / page parameters rather than
      large offset queries.
maintainers:
